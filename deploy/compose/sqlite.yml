# Symbolon with its default store, SQLite, on a named volume.
#
#   SYMBOLON_ISSUER=https://id.example.com SYMBOLON_SECRET=... docker compose -f deploy/compose/sqlite.yml up -d
#
# Symbolon speaks plain HTTP inside the container; put a TLS-terminating reverse proxy in front of it, and
# make SYMBOLON_ISSUER the public https:// URL. docs/guides/operator.md has the details.
services:
  symbolon:
    image: ghcr.io/codenhub/symbolon:latest
    restart: unless-stopped
    environment:
      SYMBOLON_ISSUER: ${SYMBOLON_ISSUER:?set the public https:// URL}
      SYMBOLON_SECRET: ${SYMBOLON_SECRET:?generate a secret, see docs/guides/operator.md}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - symbolon-data:/data

volumes:
  symbolon-data:
