# Symbolon with PostgreSQL.
#
#   SYMBOLON_ISSUER=https://id.example.com SYMBOLON_SECRET=... POSTGRES_PASSWORD=... \
#     docker compose -f deploy/compose/postgres.yml up -d
#
# As with sqlite.yml, put a TLS-terminating reverse proxy in front of Symbolon.
services:
  symbolon:
    image: ghcr.io/codenhub/symbolon:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYMBOLON_ISSUER: ${SYMBOLON_ISSUER:?set the public https:// URL}
      SYMBOLON_SECRET: ${SYMBOLON_SECRET:?generate a secret, see docs/guides/operator.md}
      SYMBOLON_DATABASE: postgres://symbolon:${POSTGRES_PASSWORD}@postgres:5432/symbolon
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: symbolon
      POSTGRES_DB: symbolon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symbolon -d symbolon"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
