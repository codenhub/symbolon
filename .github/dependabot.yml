# Weekly update pull requests, labelled with the repository's own `type:chore` rather than labels Dependabot
# would create. npm updates arrive as catalog changes in pnpm-workspace.yaml, with the lockfile.
#
# The groups take minor and patch updates only, so one week is one grouped pull request per group and
# directory: Dependabot groups each listed directory on its own, so the actions can arrive as two pull
# requests, and npm as two, `codenhub` and `toolchain`. A major update
# arrives as a pull request of its own, because it is a decision (it may need code changes) rather than
# upkeep, and a group that mixes one in cannot be merged until the major is dealt with.
# `docs/ci.md`, "Pinning third-party actions", records why the actions are updated this way.
#
# The Docker base image is not listed: its tag is `node:${NODE_VERSION}-alpine`, and NODE_VERSION moves by
# hand with `.nvmrc`, which CI checks it matches (docs/workspace.md, "Toolchain").
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite actions under .github/actions/, which `directory: /` alone misses.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    labels: ["type:chore"]
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["type:chore"]
    # The major of Node's types follows the Node line in `engines` and `.nvmrc` and moves by hand with it:
    # types for a newer line accept APIs the pinned runtime does not have. Minor and patch updates still
    # arrive (docs/workspace.md, "Versions").
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      codenhub:
        patterns: ["@codenhub/*"]
        update-types: ["minor", "patch"]
      toolchain:
        patterns: ["*"]
        exclude-patterns: ["@codenhub/*"]
        update-types: ["minor", "patch"]
