packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"

# Every version is declared once, here, and packages refer to it as `catalog:`,
# so the workspace can never hold two versions of one dependency by accident.
catalog:
  "@codenhub/i18n": ^0.1.0
  "@codenhub/icons": ^0.2.1
  "@codenhub/jwt": ^0.0.1
  "@codenhub/oidc": ^0.0.1
  "@codenhub/styles": ^0.6.0
  "@codenhub/validation": ^0.4.0
  "@playwright/test": ^1.61.1
  "@types/node": ^24.19.2
  "@vitest/coverage-v8": ^5.0.5
  esbuild: ^0.28.1
  miniflare: ^5.20261012.1-beta
  oxfmt: ^0.73.0
  oxlint: ^1.72.0
  postgres: ^3.4.9
  prettier: ^3.6.0
  typescript: ^7.0.2
  vite: ^8.1.3
  vitest: ^5.0.5
  wrangler: ^4.120.0

blockExoticSubdeps: true
trustPolicy: no-downgrade
allowBuilds:
  esbuild: true
  workerd: true

# Makes pnpm refuse an install outside `engines` in package.json instead of only printing a warning, so a
# mismatch surfaces before it turns into a failure no one can reproduce. It lives here because pnpm ignores
# `engine-strict` in .npmrc: checked with pnpm 11.7.
engineStrict: true
